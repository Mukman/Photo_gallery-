<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Album</title>
<style>
  :root {
    --bg: #121110;
    --panel: #1a1918;
    --ink: #ece7e0;
    --muted: #9a938a;
    --line: #2c2a27;
    --accent: #c9a15a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 64px 24px 40px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  header p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 16px 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px;
  }

  .frame {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--panel);
    cursor: pointer;
  }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .frame:hover img {
    transform: scale(1.04);
  }

  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background:
      repeating-linear-gradient(45deg, #1e1d1b, #1e1d1b 10px, #1a1918 10px, #1a1918 20px);
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 8, 0.96);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 28px;
    color: var(--ink);
    font-size: 32px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }

  footer {
    text-align: center;
    padding: 32px 16px 48px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Photo Album</h1>
  <p>Scan. Look. Remember.</p>
</header>

<main>
  <div class="grid" id="gallery">
    <!-- Replace each <img src="photos/1.jpg"> below with your real photo files -->
    <div class="frame" onclick="openLightbox('photos/1.jpg')">
      <div class="placeholder">photos/1.jpg</div>
    </div>
    <div class="frame" onclick="openLightbox('photos/2.jpg')">
      <div class="placeholder">photos/2.jpg</div>
    </div>
    <div class="frame" onclick="openLightbox('photos/3.jpg')">
      <div class="placeholder">photos/3.jpg</div>
    </div>
    <div class="frame" onclick="openLightbox('photos/4.jpg')">
      <div class="placeholder">photos/4.jpg</div>
    </div>
    <div class="frame" onclick="openLightbox('photos/5.jpg')">
      <div class="placeholder">photos/5.jpg</div>
    </div>
    <div class="frame" onclick="openLightbox('photos/6.jpg')">
      <div class="placeholder">photos/6.jpg</div>
    </div>
  </div>
</main>

<footer>Tap any photo to view full size</footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(e) {
    if (e) e.stopPropagation();
    document.getElementById('lightbox').classList.remove('open');
  }
</script>

</body>
</html>
